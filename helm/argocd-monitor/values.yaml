# yaml-language-server: $schema=values.schema.json

image:
  # @schema description: Container image repository
  repository: ghcr.io/epics-containers/argocd-monitor
  # @schema description: Image tag (defaults to Chart.appVersion)
  tag: ""
  # @schema description: Image pull policy
  # @schema enum: [Always, IfNotPresent, Never]
  pullPolicy: IfNotPresent

# @schema description: Number of pod replicas
# @schema minimum: 1
replicaCount: 1

argocd:
  # @schema description: The ArgoCD instance URL to proxy API requests to
  url: https://argocd.diamond.ac.uk
  anonymous:
    # @schema description: Use ArgoCD anonymous read-only access. Requires users.anonymous.enabled in argocd-cm. Mutating actions will fail with 403
    enabled: false

service:
  # @schema description: Kubernetes Service type
  # @schema enum: [ClusterIP, LoadBalancer, NodePort]
  type: LoadBalancer
  # @schema description: Service port
  port: 80

ingress:
  # @schema description: Enable Ingress resource
  enabled: false
  # @schema description: Ingress class name
  className: ""
  # @schema description: Ingress annotations
  # @schema additionalProperties: {"type": "string"}
  annotations: {}
  # @schema description: Ingress hostname
  host: ""
  # @schema description: TLS configuration
  tls: []

resources:
  limits:
    # @schema description: CPU limit
    cpu: 100m
    # @schema description: Memory limit
    memory: 128Mi
  requests:
    # @schema description: CPU request
    cpu: 50m
    # @schema description: Memory request
    memory: 64Mi

# @schema description: Node selector for pod scheduling
# @schema additionalProperties: {"type": "string"}
nodeSelector: {}

# @schema description: Tolerations for pod scheduling
# @schema type: array
tolerations: []

oauth2Proxy:
  # @schema description: Enable oauth2-proxy sidecar for Keycloak OIDC authentication
  enabled: false
  image:
    # @schema description: oauth2-proxy container image repository
    repository: quay.io/oauth2-proxy/oauth2-proxy
    # @schema description: oauth2-proxy image tag
    tag: v7.7.1
    # @schema description: oauth2-proxy image pull policy
    # @schema enum: [Always, IfNotPresent, Never]
    pullPolicy: IfNotPresent
  # @schema description: OIDC client ID registered in Keycloak
  clientId: ""
  # @schema description: OIDC issuer URL (e.g. https://identity.example.com/realms/myrealm)
  issuerUrl: ""
  # @schema description: Name of existing K8s Secret with keys client-secret and cookie-secret
  existingSecret: ""
  # @schema description: Additional command-line arguments for oauth2-proxy
  # @schema type: array
  extraArgs: []
  resources:
    limits:
      # @schema description: oauth2-proxy CPU limit
      cpu: 50m
      # @schema description: oauth2-proxy memory limit
      memory: 64Mi
    requests:
      # @schema description: oauth2-proxy CPU request
      cpu: 25m
      # @schema description: oauth2-proxy memory request
      memory: 32Mi

# Auto-select the namespace filter to match the user's beamline based on source IP.
# When enabled the chart renders an nginx `geo` block that maps client IP → namespace
# and exposes it at GET /api/beamline.
namespaceMap:
  # @schema description: Enable IP→namespace resolution at /api/beamline
  enabled: false
  # @schema description: CIDRs of trusted forwarding layers (ingress/oauth2-proxy). Required for real-IP recovery from X-Forwarded-For.
  # @schema type: array
  # @schema item: string
  trustedProxies: []
  # @schema description: Ordered IP-range → namespace map. First match wins. Each entry is {cidr, namespace}.
  # @schema type: array
  ranges: []

# Grafana links on the Application detail page. Served with `graylog` at
# GET /api/observability-config. The cluster key is spec.destination.name
# (falling back to spec.destination.server).
grafana:
  # @schema description: Show Grafana dashboard / Explore links on the Application detail page
  enabled: false
  # @schema description: Optional regex with one capture group applied to the cluster key. Group 1 becomes {cluster}. Empty uses the cluster key verbatim
  clusterPattern: ""
  # @schema description: Grafana base URL template. {cluster} is replaced with the cluster name (e.g. https://k8s-{cluster}-grafana.example.com)
  urlTemplate: ""
  # @schema description: Cluster name (or raw cluster key) → Grafana base URL. An empty string disables links for that cluster
  # @schema additionalProperties: {"type": "string"}
  overrides: {}
  # @schema description: UID of the Prometheus datasource used by Explore links
  datasourceUid: prometheus

# Graylog historical-log links ("Logs" per workload) on the Application detail
# page. One global Graylog server serves every cluster. Served with `grafana`
# at GET /api/observability-config.
graylog:
  # @schema description: Show a Graylog historical-logs link for each workload on the Application detail page
  enabled: false
  # @schema description: Graylog search URL. {query} is replaced with the URL-encoded Lucene query (e.g. https://graylog.example.com/search?q={query})
  urlTemplate: ""
  # @schema description: Graylog message field holding the pod name. Must be a keyword (non-analyzed) field for regex queries
  podField: pod_name
